version: "3.9"

services:
  # PostgreSQL — основная база данных
  db:
    image: postgres:15-alpine
    env_file:
      - db/.db.env
    volumes:
      - pgdata:/var/lib/postgresql/data
    # Healthcheck, чтобы backend ждал готовности базы
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Инициализация БД: создаёт таблицы и заполняет тестовыми данными
  init:
    build: ./backend
    command: ["python", "init_data.py"]
    environment:
      - DB_HOST=db
    depends_on:
      db:
        condition: service_healthy

  # FastAPI-приложение
  backend:
    build: ./backend
    environment:
      - DB_HOST=db
    depends_on:
      init:
        condition: service_completed_successfully

  # Nginx — обратный прокси к backend и раздача статики
  frontend:
    build: ./frontend
    ports:
      - "8189:80"
    depends_on:
      backend:
        condition: service_started

volumes:
  pgdata:
